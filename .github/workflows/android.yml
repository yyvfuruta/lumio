name: Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml', 'Makefile']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml', 'Makefile']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Test HTTP transport
        run: make android-test
      - name: Install pinned SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Build and verify development APK
        run: make android-apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumio-android
          path: dist/lumio-android.apk
          if-no-files-found: error
